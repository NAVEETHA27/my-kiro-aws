<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <!-- Deep space base -->
    <radialGradient id="g1" cx="15%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#1a3a7c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#0e2a5c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#3b1d6e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="80%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#0c3460" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebula glow top-right -->
    <radialGradient id="g5" cx="90%" cy="5%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for star glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="900" fill="#020818"/>
  <rect width="1440" height="900" fill="url(#g1)"/>
  <rect width="1440" height="900" fill="url(#g2)"/>
  <rect width="1440" height="900" fill="url(#g3)"/>
  <rect width="1440" height="900" fill="url(#g4)"/>
  <rect width="1440" height="900" fill="url(#g5)"/>

  <!-- Grid lines (subtle) -->
